name: 改进建议
description: 提出功能、菜单内容或交互方面的建议
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题
      description: 先说使用场景和不方便的地方。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 你希望如何改进
      description: 可以描述想法或贴参考图，不需要提供完整方案。
    validations:
      required: true
