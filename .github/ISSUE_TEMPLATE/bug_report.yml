name: 问题反馈
description: 抽签、菜单、保存或界面出现了问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有问题。安全漏洞请通过仓库 Security 页的私密报告入口提交。
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      description: 从打开哪个页面开始，依次做了哪些操作？
      placeholder: "1. 打开网站\n2. 点击……\n3. 出现……"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 期望与实际结果
      description: 你期望发生什么，实际发生了什么？
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境
      description: 浏览器及版本、系统、设备或屏幕尺寸。
      placeholder: Chrome / macOS / 1440 × 900
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 站点或代码版本
      description: 在线站点地址，或自行部署使用的提交 SHA。
  - type: textarea
    id: details
    attributes:
      label: 截图或补充信息
      description: 可附截图、控制台报错。请先移除隐私信息和访问令牌。
